<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Portfelik</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="ikona-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e6edf3;font-family:system-ui,sans-serif}
  main{max-width:420px;margin:0 auto;padding:40px 20px;text-align:center}
  img{width:120px;height:120px;border-radius:26px}
  h1{margin:16px 0 4px}
  p{color:#8b98a9;line-height:1.5}
  a.btn{display:block;margin:24px 0 8px;padding:16px;border-radius:12px;background:#3b82f6;color:#fff;text-decoration:none;font-weight:600;font-size:17px}
</style>
</head>
<body>
<main id="m" style="display:none">
  <img src="ikona-512.png" alt="Portfelik">
  <h1>Portfelik</h1>
  <p>To strona-skrót. Dodaj ją do ekranu głównego telefonu, a potem raz kliknij przycisk poniżej. Od tej pory skrót będzie od razu otwierał aplikację.</p>
  <a class="btn" id="otworz" href="#">Otwórz Portfelik</a>
</main>
<script>
  // WKLEJ TUTAJ adres swojej aplikacji (ten z końcówką /exec), między cudzysłowami:
  var ADRES_APLIKACJI = 'WKLEJ_TUTAJ_ADRES_EXEC';

  var ustawienia = location.search.indexOf('ustawienia') >= 0, widziany = false;
  try { widziany = localStorage.getItem('portfelik_ok') === '1'; } catch (e) {}
  function idz() { try { localStorage.setItem('portfelik_ok', '1'); } catch (e) {} location.replace(ADRES_APLIKACJI); }
  if (widziany && !ustawienia) { idz(); }
  else {
    document.getElementById('m').style.display = 'block';
    document.getElementById('otworz').addEventListener('click', function (e) { e.preventDefault(); idz(); });
  }
</script>
</body>
</html>
